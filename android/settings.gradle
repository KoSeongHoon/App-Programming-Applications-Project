pluginManagement {
    def flutterRoot = {
        def localProperties = new File(rootDir, 'local.properties')
        def properties = new Properties()

        if (localProperties.exists()) {
            localProperties.withInputStream { stream -> properties.load(stream) }
        }

        return properties.getProperty('flutter.sdk') ?:
               System.env.FLUTTER_HOME ?:
               "${System.properties['user.home']}/flutter"
    }()

    includeBuild("${flutterRoot}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.0.1" apply false
    id "org.jetbrains.kotlin.android" version "2.3.20" apply false
}

include ":app"
